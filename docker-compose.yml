services:
  icecast:
    build: ./icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER}
      ICECAST_ADMIN_EMAIL: admin@${VINYLSTREAM_HOSTNAME}
      ICECAST_HOSTNAME: ${VINYLSTREAM_HOSTNAME}
      ICECAST_MAX_LISTENERS: ${ICECAST_MAX_LISTENERS}
    ports:
      # Exposed so OBS / source clients can push to it directly.
      # Override the host bind via env (e.g. ICECAST_BIND=127.0.0.1)
      # if you only want LAN-side ingest.
      - "${ICECAST_BIND:-0.0.0.0}:${ICECAST_PORT:-8000}:8000"
    networks:
      - vinylstream

  vinylstream:
    build: .
    restart: unless-stopped
    depends_on:
      - icecast
    environment:
      VINYLSTREAM_LISTEN: ${VINYLSTREAM_LISTEN}
      VINYLSTREAM_DB: ${VINYLSTREAM_DB}
      ICECAST_URL: ${ICECAST_URL}
      ICECAST_MOUNT: ${ICECAST_MOUNT}
      ICECAST_ADMIN_USER: ${ICECAST_ADMIN_USER}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_POLL_INTERVAL: ${ICECAST_POLL_INTERVAL}
      STREAM_NAME: ${STREAM_NAME}
      STREAM_DESCRIPTION: ${STREAM_DESCRIPTION}
      STREAM_GENRE: ${STREAM_GENRE}
      STREAM_BIT_DEPTH: ${STREAM_BIT_DEPTH:-}
      VINYLSTREAM_ALLOWED_ORIGINS: ${VINYLSTREAM_ALLOWED_ORIGINS:-}
    ports:
      # Backend HTTP port. Reverse-proxy traffic to this from your
      # existing nginx (or whatever fronts the box). Bind to localhost
      # by default so the host's nginx is the only thing that can
      # reach it.
      - "${VINYLSTREAM_BIND:-127.0.0.1}:${VINYLSTREAM_PORT:-8080}:8080"
    volumes:
      - vinylstream_data:/data
    networks:
      - vinylstream

  # Caddy is optional. It's only useful when this box is responsible
  # for TLS itself (no upstream reverse proxy). Enable it with:
  #   docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - vinylstream
      - icecast
    ports:
      - "80:80"
      - "443:443"
    environment:
      VINYLSTREAM_HOSTNAME: ${VINYLSTREAM_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - vinylstream

networks:
  vinylstream:
    driver: bridge

volumes:
  vinylstream_data:
  caddy_data:
  caddy_config:
