# nginx server block for radio.revela.dev
#
# Adapt to your existing nginx layout. Pairs with the VinylStream
# docker-compose stack running on the same Unraid host with:
#   - vinylstream backend on 127.0.0.1:8080
#   - icecast on 127.0.0.1:8000
#
# Drop this into your sites-available (or wherever you keep
# git.revela.dev's config), symlink to sites-enabled, then:
#   nginx -t && systemctl reload nginx
#
# If you're using a TLS automation tool (certbot, acme.sh), follow
# its instructions to issue/renew the cert for radio.revela.dev.
# The block below assumes certs at /etc/letsencrypt/live/radio.revela.dev/.

upstream vinylstream_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream icecast_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

# Redirect HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name radio.revela.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radio.revela.dev;

    ssl_certificate     /etc/letsencrypt/live/radio.revela.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.revela.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # FLAC stream goes straight to Icecast. Buffering must be disabled
    # or listeners will see large startup delays as nginx tries to
    # buffer chunked audio before forwarding.
    location = /live.flac {
        proxy_pass http://icecast_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      24h;
        proxy_send_timeout      24h;
        send_timeout            24h;
        tcp_nodelay             on;
    }

    # Icecast status JSON, in case the frontend (or someone with curl)
    # wants to query the source directly.
    location = /status-json.xml {
        proxy_pass http://icecast_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket: live listener-count updates from the Go backend.
    location = /ws {
        proxy_pass http://vinylstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else (HTML, JS, CSS, /api, /healthz) goes to the
    # Go backend.
    location / {
        proxy_pass http://vinylstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reasonable defaults.
    client_max_body_size 1m;
    access_log /var/log/nginx/radio.revela.dev.access.log;
    error_log  /var/log/nginx/radio.revela.dev.error.log;
}
