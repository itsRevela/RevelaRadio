<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>radio.revela.dev</title>
    <link rel="stylesheet" href="/style.css" />
</head>
<body>
    <div class="bg" aria-hidden="true"></div>
    <div class="bg-overlay" aria-hidden="true"></div>

    <main class="app">
        <header class="masthead">
            <h1 id="stream-name">radio.revela.dev</h1>
            <p id="stream-description" class="muted">Lossless vinyl audio livestream</p>
        </header>

        <section class="player" aria-label="Audio player">
            <div class="status-row">
                <span class="status-dot" id="status-dot" data-state="unknown" aria-hidden="true"></span>
                <span id="status-label">connecting...</span>
            </div>

            <div class="player-controls">
                <button id="play-btn" type="button" class="play-btn" aria-pressed="false">
                    <span class="play-icon" aria-hidden="true"></span>
                    <span class="play-label">Play Stream</span>
                </button>

                <div class="volume" role="group" aria-label="Volume">
                    <span class="volume-icon" aria-hidden="true"></span>
                    <input
                        type="range"
                        id="volume-slider"
                        class="volume-slider"
                        min="0"
                        max="100"
                        step="1"
                        value="80"
                        aria-label="Volume"
                    />
                </div>
            </div>

            <audio id="audio" preload="none" src="/live.flac"></audio>
        </section>

        <section class="stats" aria-label="Stream stats">
            <div class="stat">
                <span class="stat-value" id="stat-listeners">--</span>
                <span class="stat-label">listening now</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-peak">--</span>
                <span class="stat-label">peak (24h)</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-uptime">--</span>
                <span class="stat-label">uptime</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-format">--</span>
                <span class="stat-label">format</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-samplerate">--</span>
                <span class="stat-label">sample rate</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-bitdepth">--</span>
                <span class="stat-label">bit depth</span>
            </div>
        </section>

        <section class="history" aria-label="Listener history">
            <header class="history-head">
                <h2>Listeners over time</h2>
                <div class="range-toggle" role="tablist">
                    <button data-range="1h" type="button">1h</button>
                    <button data-range="6h" type="button">6h</button>
                    <button data-range="24h" class="active" type="button">24h</button>
                    <button data-range="7d" type="button">7d</button>
                </div>
            </header>
            <svg id="history-chart" viewBox="0 0 600 160" preserveAspectRatio="none" role="img" aria-label="Listener count history"></svg>
        </section>

        <footer class="footer muted">
            <a href="https://fluxer.gg/CgS3uFT7" target="_blank" rel="noopener">Contact</a>
            <span aria-hidden="true">·</span>
            <span>VinylStream</span>
            <span aria-hidden="true">·</span>
            <a href="/live.flac">Direct stream</a>
        </footer>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
